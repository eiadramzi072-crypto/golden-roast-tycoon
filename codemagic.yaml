workflows:
  android-workflow:
    name: Golden Roast Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Android
        script: |
          rm -rf android
          npx cap init "Golden Roast Tycoon" com.goldenroast.tycoon --web-dir dist
          npx cap add android
          npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          # هنا السر: نترك النظام يختار الجافا بنفسه ونطلب منه فقط البناء
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
