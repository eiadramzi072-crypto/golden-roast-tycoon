workflows:
  android-workflow:
    name: Simple Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    scripts:
      - name: Install packages
        script: npm install

      - name: Build web
        script: npm run build

      - name: Recreate Android clean
        script: |
          rm -rf android
          npx cap init App com.app.test --web-dir dist
          npx cap add android
          npx cap sync

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
