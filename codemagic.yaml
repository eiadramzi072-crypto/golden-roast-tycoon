workflows:
  android-workflow:
    name: Golden Roast Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Set Java 17 correctly
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Setup Android Platform
        script: |
          rm -rf android
          npx cap init "Golden Roast Tycoon" com.goldenroast.tycoon --web-dir dist
          npx cap add android
          npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
