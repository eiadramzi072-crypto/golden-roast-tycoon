workflows:
  android-workflow:
    name: Golden Roast Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Set Java version
        script: sdk use java 17.0.10-term
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Setup Android Platform
        script: |
          npx cap init "Golden Roast Tycoon" com.goldenroast.tycoon --web-dir dist
          npx cap add android
          npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
